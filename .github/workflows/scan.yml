name: Günlük tarama

on:
  schedule:
    - cron: "0 16 * * *" # Her gün 19:00 Türkiye saati
  workflow_dispatch:
    inputs:
      source:
        description: "Yalnızca bu kaynağı tara (id, boş = hepsi)"
        required: false
      force:
        description: "Sayfa değişmemiş olsa da yeniden çıkar"
        type: boolean
        default: false

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tara
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ -n "${INPUT_SOURCE:-}" ]; then args+=(--source "$INPUT_SOURCE"); fi
          if [ "${INPUT_FORCE:-false}" = "true" ]; then args+=(--force); fi
          npm run scan -- "${args[@]}"

      - name: Commit ve push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "chore(data): günlük tarama $(TZ=Europe/Istanbul date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Hata bildir
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/report-issue.sh "Günlük tarama başarısız" \
            "Günlük tarama başarısız oldu. Ayrıntılar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
