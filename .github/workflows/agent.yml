name: Öneri ajanı

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "İncelenecek issue numarası"
        required: true
      force:
        description: "Daha önce incelendiyse de tekrar incele"
        type: boolean
        default: false

concurrency:
  group: agent-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && (contains(github.event.issue.labels.*.name, 'oneri') || contains(github.event.issue.labels.*.name, 'hata-bildirimi'))) ||
      (github.event.action == 'labeled' && (github.event.label.name == 'oneri' || github.event.label.name == 'hata-bildirimi'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Etiketleri hazırla
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run -s setup-labels
      - name: İncele
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AGENT_MODE: ${{ vars.AGENT_MODE || 'comment' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${FORCE:-false}" = "true" ]; then npm run agent -- --force; else npm run agent; fi
