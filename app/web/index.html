<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KampüsRadar - CENG ve Üniversite Öğrencileri için Akıllı Fırsat, Hackathon ve Duyuru Takip Asistanı">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KampüsRadar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KampüsRadar | CENG & Kampüs Fırsat Radarı</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* KampüsRadar Ultra-Modern Radar Preloader */
    body {
      margin: 0;
      padding: 0;
      background-color: #0B0F19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #kr-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #111827 0%, #0B0F19 100%);
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
    }

    #kr-preloader.preloader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .radar-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(37, 99, 235, 0.15);
      margin-bottom: 28px;
    }

    /* Radar Eksen Çizgileri */
    .radar-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(59, 130, 246, 0.2);
      box-sizing: border-box;
    }

    .radar-grid::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(59, 130, 246, 0.15);
    }

    .radar-grid::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      background: rgba(59, 130, 246, 0.15);
    }

    .radar-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(59, 130, 246, 0.25);
      box-sizing: border-box;
    }

    .ring-1 { width: 40px; height: 40px; }
    .ring-2 { width: 80px; height: 80px; }
    .ring-3 { width: 120px; height: 120px; }

    /* Dönen Radar Işını */
    .radar-sweep {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(37, 99, 235, 0) 0deg,
        rgba(37, 99, 235, 0) 260deg,
        rgba(37, 99, 235, 0.35) 330deg,
        rgba(59, 130, 246, 0.8) 360deg
      );
      animation: radar-spin 2s linear infinite;
    }

    @keyframes radar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Nabız Dalgaları (Sonar Pulses) */
    .sonar-wave {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(96, 165, 250, 0.6);
      opacity: 0;
      animation: sonar-pulse 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    .sonar-wave.delay-1 {
      animation-delay: 1.1s;
    }

    @keyframes sonar-pulse {
      0% {
        transform: scale(0.2);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    /* Merkez Nokta */
    .radar-core {
      position: relative;
      width: 14px;
      height: 14px;
      background: #3B82F6;
      border-radius: 50%;
      box-shadow: 0 0 16px #60A5FA, 0 0 30px rgba(59, 130, 246, 0.8);
      z-index: 10;
    }

    /* Başlık ve Metinler */
    .preloader-brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 0%, #93C5FD 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .preloader-sub {
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
      margin-bottom: 24px;
    }

    /* Yükleme Çubuğu */
    .preloader-bar-bg {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .preloader-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #2563EB, #60A5FA);
      border-radius: 4px;
      animation: bar-slide 1.5s ease-in-out infinite;
    }

    @keyframes bar-slide {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 40%; }
    }

    .preloader-hint {
      margin-top: 14px;
      font-size: 11px;
      color: #64748B;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <!-- Açılışta anında ekrana gelen animasyonlu Radar Preloader -->
  <div id="kr-preloader">
    <div class="radar-wrapper">
      <div class="radar-grid"></div>
      <div class="radar-ring ring-1"></div>
      <div class="radar-ring ring-2"></div>
      <div class="radar-ring ring-3"></div>
      <div class="sonar-wave"></div>
      <div class="sonar-wave delay-1"></div>
      <div class="radar-sweep"></div>
      <div class="radar-core"></div>
    </div>
    <div class="preloader-brand">KampüsRadar</div>
    <div class="preloader-sub">CENG & Kampüs Fırsat Radarı</div>
    <div class="preloader-bar-bg">
      <div class="preloader-bar-fill"></div>
    </div>
    <div class="preloader-hint">Yapay zeka ve bulut veritabanı bağlanıyor...</div>
  </div>

  <script>
    // Flutter motoru ilk kareyi çizdiğinde preloader'ı pürüzsüzce kapat
    window.addEventListener('flutter-first-frame', function () {
      var p = document.getElementById('kr-preloader');
      if (p) {
        p.classList.add('preloader-hidden');
        setTimeout(function () { p.remove(); }, 600);
      }
    });

    // En fazla 8 saniye sonra otomatik kaldır (güvenlik yedeği)
    setTimeout(function() {
      var p = document.getElementById('kr-preloader');
      if (p) {
        p.classList.add('preloader-hidden');
        setTimeout(function () { p.remove(); }, 600);
      }
    }, 8000);

    // Eski önbelleği ve service worker kalıntılarını otomatik temizle
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20260920_v1" async></script>
</body>
</html>
